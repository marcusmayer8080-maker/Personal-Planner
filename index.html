<title>باقی‌مانده</title>
<style>
  :root{
    --bg:#faf9f6;
    --surface:#ffffff;
    --line:#e6e3dc;
    --ink:#242220;
    --ink-dim:#7a766e;
    --accent:#a1471f;
    --accent-soft:#f3e4dc;
    --done:#8b9a7c;
    --done-soft:#eef1e9;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#1c1a17;
      --surface:#242220;
      --line:#3a352f;
      --ink:#efece5;
      --ink-dim:#a39c8f;
      --accent:#e08a5c;
      --accent-soft:#3a2a20;
      --done:#a7b895;
      --done-soft:#2a2f24;
    }
  }
  :root[data-theme="dark"]{
    --bg:#1c1a17;
    --surface:#242220;
    --line:#3a352f;
    --ink:#efece5;
    --ink-dim:#a39c8f;
    --accent:#e08a5c;
    --accent-soft:#3a2a20;
    --done:#a7b895;
    --done-soft:#2a2f24;
  }

  *{box-sizing:border-box}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Vazirmatn',system-ui,sans-serif;
    direction:rtl;
    padding-inline:16px;
    padding-block:18px;
    min-height:100%;
    overflow-y:auto;
  }
  .wrap{max-width:1100px;margin:0 auto}

  header{
    margin-bottom:12px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    flex-wrap:wrap;
  }
  header h1{
    font-size:1.2rem;
    font-weight:800;
    margin:0;
    letter-spacing:-0.01em;
    white-space:nowrap;
  }

  .summary{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
  }
  .stat{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:8px;
    padding:6px 12px;
    min-width:90px;
  }
  .stat .num{
    font-size:1.05rem;
    font-weight:800;
    font-variant-numeric:tabular-nums;
    display:block;
  }
  .stat .lbl{color:var(--ink-dim);font-size:0.7rem}
  .stat.remaining .num{color:var(--accent)}

  .fab{
    position:fixed;
    left:18px;
    top:calc(18px + env(safe-area-inset-top, 0px));
    width:40px;
    height:40px;
    border-radius:50%;
    border:none;
    background:var(--accent);
    color:var(--surface);
    font-size:1.3rem;
    line-height:1;
    cursor:pointer;
    box-shadow:0 4px 14px rgba(0,0,0,0.22);
    z-index:20;
  }
  .fab:hover{opacity:0.92}

  .add-popover{
    position:fixed;
    left:18px;
    top:calc(64px + env(safe-area-inset-top, 0px));
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:10px;
    padding:10px;
    box-shadow:0 8px 24px rgba(0,0,0,0.18);
    display:flex;
    gap:6px;
    z-index:20;
  }
  .add-popover input{
    background:var(--bg);
    border:1px solid var(--line);
    border-radius:7px;
    padding:6px 10px;
    color:var(--ink);
    font-family:inherit;
    font-size:0.8rem;
    width:150px;
  }
  .add-popover input:focus{outline:2px solid var(--accent);outline-offset:1px}
  .add-popover button{
    background:var(--ink);
    color:var(--bg);
    border:none;
    border-radius:7px;
    padding:6px 12px;
    font-family:inherit;
    font-weight:700;
    font-size:0.78rem;
    cursor:pointer;
    white-space:nowrap;
  }

  #projects{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(200px, 1fr));
    gap:10px;
    align-items:start;
  }

  .project{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:10px;
    padding:10px 12px 8px;
  }
  .project-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:6px;
    margin-bottom:6px;
  }
  .project-title{
    font-size:0.88rem;
    font-weight:800;
    flex:1;
    background:transparent;
    border:none;
    color:var(--ink);
    font-family:inherit;
    padding:2px 0;
    width:0;
    min-width:0;
  }
  .project-title:focus{outline:none;border-bottom:1px dashed var(--line)}
  .del-project{
    background:none;border:none;color:var(--ink-dim);
    cursor:pointer;font-size:0.85rem;line-height:1;padding:2px 3px;
  }
  .del-project:hover{color:var(--accent)}

  .bar{
    height:4px;
    background:var(--bg);
    border-radius:99px;
    overflow:hidden;
    margin-bottom:8px;
  }
  .bar-fill{
    height:100%;
    background:var(--done);
    border-radius:99px;
    transition:width .25s ease;
  }

  .tasks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
  .task{
    display:flex;
    align-items:center;
    gap:7px;
    padding:3px 4px;
    border-radius:6px;
  }
  .task:hover{background:var(--bg)}
  .task input[type=checkbox]{
    appearance:none;
    width:15px;height:15px;
    border:1.5px solid var(--line);
    border-radius:4px;
    flex-shrink:0;
    cursor:pointer;
    position:relative;
    background:var(--surface);
  }
  .task input[type=checkbox]:checked{
    background:var(--done);
    border-color:var(--done);
  }
  .task input[type=checkbox]:checked::after{
    content:"";
    position:absolute;
    right:4px;top:1px;
    width:3px;height:7px;
    border:solid var(--surface);
    border-width:0 2px 2px 0;
    transform:rotate(35deg);
  }
  .task input.task-text{
    flex:1;
    width:0;
    min-width:0;
    background:transparent;
    border:none;
    color:var(--ink);
    font-family:inherit;
    font-size:0.78rem;
    padding:2px 0;
  }
  .task input.task-text:focus{outline:none;border-bottom:1px dashed var(--line)}
  .task.done input.task-text{color:var(--ink-dim);text-decoration:line-through}
  .del-task{
    background:none;border:none;color:var(--ink-dim);
    opacity:0;cursor:pointer;font-size:0.8rem;padding:2px 3px;
  }
  .task:hover .del-task{opacity:1}
  .del-task:hover{color:var(--accent)}

  .add-task{
    display:flex;gap:5px;margin-top:6px;
    border-top:1px solid var(--line);
    padding-top:6px;
  }
  .add-task input{
    flex:1;
    width:0;
    min-width:0;
    background:var(--bg);
    border:1px solid var(--line);
    border-radius:7px;
    padding:5px 8px;
    color:var(--ink);
    font-family:inherit;
    font-size:0.76rem;
  }
  .add-task input:focus{outline:2px solid var(--accent);outline-offset:1px}
  .add-task button{
    background:var(--accent-soft);
    color:var(--accent);
    border:none;
    border-radius:7px;
    padding:5px 10px;
    font-family:inherit;
    font-weight:700;
    font-size:0.8rem;
    cursor:pointer;
  }
  .add-task button:hover{opacity:0.85}

  .empty-note{
    color:var(--ink-dim);
    font-size:0.8rem;
    text-align:center;
    padding:10px 0;
    grid-column:1/-1;
  }

  footer{
    margin-top:12px;
    color:var(--ink-dim);
    font-size:0.68rem;
    text-align:center;
  }
</style>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;800&display=swap">

<div class="wrap">
  <header>
    <h1>اقدامات مانده پروژه‌ها</h1>
    <div class="summary" id="summary"></div>
  </header>

  <div id="projects"></div>

  <footer>ذخیره‌سازی فقط در همین مرورگر انجام می‌شود</footer>
</div>

<button id="fabAdd" class="fab" aria-label="افزودن پروژه" title="افزودن پروژه">+</button>
<div id="addPopover" class="add-popover" hidden>
  <input id="newProjectInput" type="text" placeholder="نام پروژه‌ی جدید…" />
  <button id="addProjectBtn">افزودن</button>
</div>

<script>
(function(){
  var STORAGE_KEY = 'planner-data-v1';

  var seed = [
    {
      id: 'p1', title: 'وب‌سایت فروشگاه',
      tasks: [
        {id:'t1', text:'اتصال درگاه پرداخت', done:false},
        {id:'t2', text:'صفحه‌ی پیگیری سفارش', done:false},
        {id:'t3', text:'تست ریسپانسیو موبایل', done:true}
      ]
    },
    {
      id: 'p2', title: 'اپلیکیشن مدیریت انبار',
      tasks: [
        {id:'t4', text:'گزارش خروجی اکسل', done:false},
        {id:'t5', text:'اصلاح باگ جستجو', done:false}
      ]
    },
    {
      id: 'p3', title: 'داشبورد داخلی',
      tasks: [
        {id:'t6', text:'نمودار فروش ماهانه', done:false}
      ]
    }
  ];

  function load(){
    try{
      var raw = localStorage.getItem(STORAGE_KEY);
      if(raw) return JSON.parse(raw);
    }catch(e){}
    return seed;
  }
  function save(){
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){}
  }
  function uid(){ return 'id' + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

  var state = load();

  var projectsEl = document.getElementById('projects');
  var summaryEl = document.getElementById('summary');

  function render(){
    projectsEl.innerHTML = '';
    var totalTasks = 0, doneTasks = 0;

    if(state.length === 0){
      var note = document.createElement('div');
      note.className = 'empty-note';
      note.textContent = 'هنوز پروژه‌ای اضافه نکرده‌اید';
      projectsEl.appendChild(note);
    }

    state.forEach(function(project){
      totalTasks += project.tasks.length;
      doneTasks += project.tasks.filter(function(t){return t.done}).length;

      var card = document.createElement('div');
      card.className = 'project';

      var head = document.createElement('div');
      head.className = 'project-head';

      var titleInput = document.createElement('input');
      titleInput.className = 'project-title';
      titleInput.value = project.title;
      titleInput.addEventListener('change', function(){
        project.title = titleInput.value || 'بدون‌نام';
        save();
      });

      var remaining = project.tasks.filter(function(t){return !t.done}).length;

      var delProjectBtn = document.createElement('button');
      delProjectBtn.className = 'del-project';
      delProjectBtn.textContent = '✕';
      delProjectBtn.setAttribute('aria-label','حذف پروژه');
      delProjectBtn.addEventListener('click', function(){
        state = state.filter(function(p){return p.id !== project.id});
        save(); render();
      });

      head.appendChild(titleInput);
      head.appendChild(delProjectBtn);
      card.appendChild(head);

      var bar = document.createElement('div');
      bar.className = 'bar';
      var barFill = document.createElement('div');
      barFill.className = 'bar-fill';
      var pct = project.tasks.length ? Math.round(100 * (project.tasks.length - remaining) / project.tasks.length) : 0;
      barFill.style.width = pct + '%';
      bar.appendChild(barFill);
      card.appendChild(bar);

      var list = document.createElement('ul');
      list.className = 'tasks';

      project.tasks.filter(function(t){return !t.done}).forEach(function(task){
        var li = document.createElement('li');
        li.className = 'task';

        var cb = document.createElement('input');
        cb.type = 'checkbox';
        cb.checked = task.done;
        var cbId = 'cb-' + task.id;
        cb.id = cbId;
        cb.addEventListener('change', function(){
          task.done = cb.checked;
          save(); render();
        });

        var label = document.createElement('input');
        label.type = 'text';
        label.className = 'task-text';
        label.value = task.text;
        label.addEventListener('change', function(){
          task.text = label.value.trim() || task.text;
          label.value = task.text;
          save();
        });

        var delBtn = document.createElement('button');
        delBtn.className = 'del-task';
        delBtn.textContent = '✕';
        delBtn.setAttribute('aria-label','حذف کار');
        delBtn.addEventListener('click', function(){
          project.tasks = project.tasks.filter(function(t){return t.id !== task.id});
          save(); render();
        });

        li.appendChild(cb);
        li.appendChild(label);
        li.appendChild(delBtn);
        list.appendChild(li);
      });

      card.appendChild(list);

      var addTask = document.createElement('div');
      addTask.className = 'add-task';
      var taskInput = document.createElement('input');
      taskInput.type = 'text';
      taskInput.placeholder = 'کار جدید…';
      var addTaskBtn = document.createElement('button');
      addTaskBtn.textContent = '+';

      function submitTask(){
        var val = taskInput.value.trim();
        if(!val) return;
        project.tasks.push({id: uid(), text: val, done:false});
        taskInput.value = '';
        save(); render();
      }
      addTaskBtn.addEventListener('click', submitTask);
      taskInput.addEventListener('keydown', function(e){
        if(e.key === 'Enter') submitTask();
      });

      addTask.appendChild(taskInput);
      addTask.appendChild(addTaskBtn);
      card.appendChild(addTask);

      projectsEl.appendChild(card);
    });

    summaryEl.innerHTML = '';
    var stats = [
      {num: state.length, lbl: 'پروژه فعال', cls:''},
      {num: totalTasks - doneTasks, lbl: 'کار باقی‌مانده', cls:'remaining'},
      {num: doneTasks, lbl: 'کار انجام‌شده', cls:''}
    ];
    stats.forEach(function(s){
      var el = document.createElement('div');
      el.className = 'stat ' + s.cls;
      el.innerHTML = '<span class="num">'+s.num+'</span><span class="lbl">'+s.lbl+'</span>';
      summaryEl.appendChild(el);
    });
  }

  var popover = document.getElementById('addPopover');
  var newProjectInput = document.getElementById('newProjectInput');

  document.getElementById('fabAdd').addEventListener('click', function(){
    popover.hidden = !popover.hidden;
    if(!popover.hidden) newProjectInput.focus();
  });

  function submitProject(){
    var val = newProjectInput.value.trim();
    if(!val) return;
    state.push({id: uid(), title: val, tasks: []});
    newProjectInput.value = '';
    popover.hidden = true;
    save(); render();
  }
  document.getElementById('addProjectBtn').addEventListener('click', submitProject);
  newProjectInput.addEventListener('keydown', function(e){
    if(e.key === 'Enter') submitProject();
    if(e.key === 'Escape') popover.hidden = true;
  });

  render();
})();
</script>
